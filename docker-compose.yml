services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: swift
      POSTGRES_PASSWORD: swift_pass
      POSTGRES_DB: swift_driver_management
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U swift']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgresql://swift:swift_pass@db:5432/swift_driver_management?schema=public
      JWT_SECRET: change-me-in-production
      JWT_EXPIRES_IN: 24h
      JWT_REFRESH_EXPIRES_IN: 7d
      NODE_ENV: production
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
